<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --bg:        #111110;
  --panel:     #1a1917;
  --panel-2:   #222019;
  --ink:       #ece7dd;
  --ink-2:     #b0aa9e;
  --muted:     #7a7268;
  --faint:     #4a443c;
  --rule:      rgba(255,255,255,0.08);
  --rule-soft: rgba(255,255,255,0.05);

  --accent:      #ff7847;
  --accent-2:    #ff9468;
  --accent-wash: rgba(255,120,71,0.12);

  --green: #3ec47e; --amber: #dca64a; --red: #ef6f5e;

  --sans: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

/* ── Reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font-family: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent-wash); }

/* No atmospheric overlay on app shell — login only */

/* ── Shell ──────────────────────────────────────────────────────────────── */
#root { position: relative; z-index: 1; display: flex; height: 100dvh; }
#login-view { display: none; width: 100%; }
#app-shell  { display: none; width: 100%; height: 100dvh; }
#root.login  #login-view { display: flex; }
#root.app    #app-shell  { display: flex; }

/* ── LOGIN ──────────────────────────────────────────────────────────────── */
.login-brand {
  flex: 1; min-height: 100dvh; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 85% 65% at 22% 18%, oklch(46% 0.21 44) 0%, transparent 58%),
    radial-gradient(ellipse 65% 55% at 82% 88%, oklch(18% 0.18 284) 0%, transparent 55%),
    oklch(10% 0.025 45);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 52px;
}
.login-brand::before {
  content: ''; position: absolute; inset: 0; opacity: 0.04; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}
.login-brand-content { position: relative; z-index: 1; }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 52px; }
.login-logo .mk { width: 24px; height: 24px; background: var(--accent); border-radius: 7px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 800; color: #0f0e0d; }
.login-logo span { font-family: var(--mono); font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.55); }
.login-headline { font-size: 38px; font-weight: 700; line-height: 1.12; letter-spacing: -0.025em; color: rgba(255,255,255,0.92); margin-bottom: 16px; max-width: 13em; }
.login-tagline { font-size: 15px; color: rgba(255,255,255,0.42); line-height: 1.55; max-width: 30em; }

.login-form-panel {
  width: 420px; flex: none; background: var(--panel);
  border-left: 1px solid var(--rule);
  display: flex; flex-direction: column; justify-content: center; padding: 52px 48px;
}
.login-title { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 6px; }
.login-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
.login-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.login-tab {
  flex: 1; padding: 10px; font-size: 13.5px; font-weight: 500; color: var(--muted);
  border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .12s; cursor: pointer;
}
.login-tab:hover { color: var(--ink); }
.login-tab.active { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.login-fields { display: flex; flex-direction: column; gap: 14px; }
.login-error { font-size: 12.5px; color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 22%, transparent); border-radius: 8px; padding: 9px 12px; }

/* ── SIDEBAR ────────────────────────────────────────────────────────────── */
.sidebar {
  width: 208px; flex: none; height: 100dvh;
  background: var(--panel);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  position: relative; z-index: 10;
}
.sidebar-brand {
  height: 44px; display: flex; align-items: center; padding: 0 14px;
  border-bottom: 1px solid var(--rule-soft);
}
.wordmark { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; color: var(--ink); }
.pilot-mark { width: 17px; height: 17px; background: var(--accent); border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 800; color: #0f0e0d; }

.sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 6px 6px; overflow-y: auto; }
.side-link {
  display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 5px;
  font-size: 12.5px; font-weight: 400; color: var(--muted);
  transition: color .1s, background .1s; width: 100%; text-align: left;
}
.side-link:hover { color: var(--ink-2); background: rgba(255,255,255,0.04); }
.side-link.active { color: var(--ink); font-weight: 500; background: rgba(255,255,255,0.06); }
.side-link svg { width: 13px; height: 13px; flex: none; opacity: 0.4; }
.side-link:hover svg { opacity: 0.65; }
.side-link.active svg { opacity: 0.9; }
.side-count {
  margin-left: auto; min-width: 15px; height: 15px;
  border-radius: 999px; font-family: var(--mono); font-size: 9.5px;
  display: grid; place-items: center; padding: 0 4px; line-height: 1;
  background: rgba(255,255,255,0.06); color: var(--faint);
}
.side-count.amber { color: var(--amber); background: color-mix(in srgb, var(--amber) 11%, transparent); }
.side-count.green  { color: var(--green);  background: color-mix(in srgb, var(--green)  9%, transparent); }
.side-divider { height: 1px; background: var(--rule-soft); margin: 3px 8px; }
.project-list { display: flex; flex-direction: column; padding: 1px 0 4px 22px; }
.project-link {
  display: flex; align-items: center; gap: 6px; height: 25px;
  border-radius: 4px; padding: 0 6px;
  font-size: 11.5px; font-weight: 400; color: var(--faint);
  transition: color .1s, background .1s; width: 100%; text-align: left;
}
.project-link:hover { color: var(--muted); background: rgba(255,255,255,0.03); }
.project-link.active { color: var(--ink-2); font-weight: 500; }
.project-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; flex: none; align-items: center; }
.mini-dot { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }
.mini-dot.green { background: var(--green); }
.mini-dot.amber { background: var(--amber); }
.mini-dot.idle  { background: var(--faint); }

.sidebar-footer {
  padding: 5px 6px 14px; border-top: 1px solid var(--rule-soft);
  display: flex; flex-direction: column;
}

/* ── APP MAIN ───────────────────────────────────────────────────────────── */
.app-main { flex: 1; min-width: 0; height: 100dvh; overflow-y: auto; position: relative; z-index: 1; }
.page-wrap { max-width: 740px; margin: 0 auto; padding: 36px 28px 72px; }
.page-wrap.wide { max-width: 1020px; }

/* ── Typography ─────────────────────────────────────────────────────────── */
.h-page { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.25; }
.lede { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.lede .num { color: var(--ink-2); font-weight: 500; }
.eyebrow { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.06em; }

/* ── Metrics strip ──────────────────────────────────────────────────────── */
.metrics-strip {
  display: flex; margin-top: 20px;
  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
  background: var(--panel);
}
.metric { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; }
.metric + .metric { border-left: 1px solid var(--rule-soft); }
.metric-val { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--ink); letter-spacing: -0.02em; }
.metric-lbl { font-size: 11px; color: var(--muted); font-weight: 400; }

/* ── Section ────────────────────────────────────────────────────────────── */
.section { margin-top: 32px; }
.section-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.section-toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap; }
.section-toggle:hover .s-title { color: var(--ink); }
.s-title { font-size: 12px; font-weight: 600; color: var(--muted); transition: color .12s; letter-spacing: 0; white-space: nowrap; }
.s-count { background: var(--panel-2); border-radius: 999px; font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 1px 6px; }
.s-caret { width: 12px; height: 12px; color: var(--faint); transform: rotate(90deg); transition: transform .16s; flex: none; }
.section.collapsed .s-caret { transform: rotate(0deg); }
.section.collapsed .rows, .section.collapsed .feed, .section.collapsed .empty-ln { display: none; }
.s-seeall { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 3px; }
.s-seeall:hover { color: var(--accent); }

/* ── Rows ───────────────────────────────────────────────────────────────── */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 8px;
  border-top: 1px solid var(--rule-soft);
  background: none; width: 100%; text-align: left;
  border-left: none; border-right: none; border-bottom: none;
  transition: background .1s; position: relative;
}
.rows .row:last-child { border-bottom: 1px solid var(--rule-soft); }
button.row:hover { background: color-mix(in srgb, var(--panel-2) 55%, transparent); border-radius: 7px; cursor: pointer; }
button.row:hover .row-go { opacity: 1; transform: translateX(0); }
button.row:hover .row-hint { opacity: 1; }
.row.quiet { padding: 8px 8px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 13.5px; font-weight: 500; color: var(--ink); letter-spacing: -0.003em; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.quiet .row-title { font-size: 13px; font-weight: 450; }
.row-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.row-meta .sep { color: var(--faint); }
.row-time { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }
.row-go { color: var(--accent); width: 13px; height: 13px; flex: none; opacity: 0; transform: translateX(-4px); transition: .14s; }
.row-hint { font-family: var(--mono); font-size: 10px; color: var(--faint); opacity: 0; flex: none; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; line-height: 15px; transition: .12s; }

/* Accent rows — review queue */
.rows.accent {
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: 12px; overflow: hidden;
  background: color-mix(in srgb, var(--accent-wash) 55%, transparent);
  padding: 0 12px;
}
.rows.accent .row { border-top-color: color-mix(in srgb, var(--accent) 14%, transparent); }
.rows.accent .row:first-child { border-top: none; }
.rows.accent .row:last-child  { border-bottom: none; }

/* Inline review actions */
.review-actions { display: flex; gap: 8px; flex: none; }

/* ── Status dots ────────────────────────────────────────────────────────── */
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.green  { background: var(--green); }
.dot.amber  { background: var(--amber); }
.dot.red    { background: var(--red); }
.dot.idle   { background: var(--faint); }
.dot.accent { background: var(--accent); }
.dot.pulse  { animation: dpulse 1.8s ease-out infinite; }
@keyframes dpulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 50%, transparent); } 60% { box-shadow: 0 0 0 5px transparent; } }

.stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
.stat.green  { color: var(--green); }
.stat.amber  { color: var(--amber); }
.stat.red    { color: var(--red); }
.stat.accent { color: var(--accent); }

/* ── Avatar ─────────────────────────────────────────────────────────────── */
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 11px; background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink); letter-spacing: 0; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 40px; height: 40px; font-size: 14px; }
.av.ring-green { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--green); }
.avwrap { position: relative; flex: none; }
.avwrap .pip { position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--bg); }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); transition: background .12s, border-color .12s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.btn:hover { background: color-mix(in srgb, var(--panel-2) 80%, var(--faint)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0f0e0d; font-weight: 600; box-shadow: 0 1px 3px rgba(255,120,71,.25); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 4px 9px; font-size: 11.5px; border-radius: 6px; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: color-mix(in srgb, var(--red) 10%, transparent); }
.btn svg { width: 13px; height: 13px; }

/* ── Chips ──────────────────────────────────────────────────────────────── */
.chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.mono { font-family: var(--mono); text-transform: uppercase; color: var(--muted); }

/* ── Feed ───────────────────────────────────────────────────────────────── */
.feed { display: flex; flex-direction: column; gap: 0; }
.feedrow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; transition: background .1s; width: 100%; text-align: left; border: none; background: none; }
.feedrow:hover { background: color-mix(in srgb, var(--panel-2) 55%, transparent); cursor: pointer; }
.feedrow .who { font-size: 12px; font-weight: 600; width: 50px; flex: none; color: var(--ink); }
.feedrow .verb { font-size: 11.5px; font-weight: 500; flex: none; }
.feedrow .what { font-size: 12.5px; color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feedrow .when { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; white-space: nowrap; }

/* ── Dept groups ────────────────────────────────────────────────────────── */
.dept-group { margin-top: 28px; }
.dept-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; }
.dept-name { font-size: 12px; font-weight: 600; color: var(--ink-2); flex: none; }
.dept-info { font-size: 11px; color: var(--faint); flex: none; }
.dept-bar { margin-left: auto; width: 72px; height: 2px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.dept-bar span { display: block; height: 100%; border-radius: 3px; background: var(--green); }

/* ── Provider badge ─────────────────────────────────────────────────────── */
.pbadge { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.pbadge.claude { color: #f97316; background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.25); }
.pbadge.codex  { color: #60a5fa; background: rgba(96,165,250,.1); border: 1px solid rgba(96,165,250,.25); }

/* ── Tabs ───────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--rule); }
.tab { font-size: 12.5px; font-weight: 400; color: var(--muted); padding: 0 1px 9px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 500; border-color: var(--accent); }

/* ── Telem strip ────────────────────────────────────────────────────────── */
.telem-strip { display: flex; margin: 18px 0 4px; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; background: var(--panel); }
.telem-item { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.telem-item + .telem-item { border-left: 1px solid var(--rule-soft); }
.telem-val { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: -0.015em; }
.telem-lbl { font-size: 11px; color: var(--muted); font-weight: 400; }

/* ── Diff ───────────────────────────────────────────────────────────────── */
.diff { font-family: var(--mono); font-size: 12px; line-height: 1.75; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.diff .dl { padding: 0 14px; white-space: pre; }
.diff .dl.hunk { color: var(--accent); background: var(--accent-wash); }
.diff .dl.add  { color: var(--green); background: color-mix(in srgb, var(--green) 8%, transparent); }
.diff .dl.del  { color: var(--red);   background: color-mix(in srgb, var(--red)   7%, transparent); }
.diff .dl.meta { color: var(--muted); }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.inp, .txa {
  width: 100%; font-family: inherit; font-size: 14px;
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 9px; padding: 10px 13px; outline: none;
  transition: border-color .12s;
}
.inp:focus, .txa:focus { border-color: var(--accent); }
.txa { resize: vertical; min-height: 80px; line-height: 1.5; }

/* ── Session layout ─────────────────────────────────────────────────────── */
.session-shell { display: flex; flex-direction: column; height: 100dvh; }
.session-header { background: var(--bg); border-bottom: 1px solid var(--rule); padding: 20px 28px 0; max-width: 740px; margin: 0 auto; width: 100%; flex: none; }
.backlink { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 14px; transition: color .12s; }
.backlink:hover { color: var(--ink); }
.sess-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.3; }
.sess-output { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); }
.sess-output-inner { max-width: 760px; margin: 0 auto; padding: 22px 32px; }
.out-line { font-family: var(--mono); font-size: 12.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
.out-line.tool { color: var(--accent); }
.out-line.dim  { color: var(--muted); }
.cursor-blink  { display: inline-block; width: 6px; height: 13px; background: var(--green); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── Command palette ────────────────────────────────────────────────────── */
.cmdk-overlay { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-start; padding-top: 13vh; }
.cmdk-overlay.show { display: flex; }
.cmdk { width: min(560px, 92vw); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,.65); overflow: hidden; }
.cmdk-inp { width: 100%; border: none; background: none; padding: 17px 20px; font-family: var(--sans); font-size: 18px; font-weight: 400; color: var(--ink); outline: none; border-bottom: 1px solid var(--rule-soft); }
.cmdk-inp::placeholder { color: var(--faint); }
.cmdk-list { max-height: 44vh; overflow-y: auto; padding: 8px; }
.cmdk-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; transition: background .1s; }
.cmdk-item.hi { background: var(--panel); }
.cmdk-kind { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; color: var(--muted); width: 52px; flex: none; }
.cmdk-label { font-size: 14px; font-weight: 500; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-sub { font-size: 12px; color: var(--muted); flex: none; }
.cmdk-foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--rule-soft); font-family: var(--mono); font-size: 10px; color: var(--muted); }
.cmdk-empty { padding: 28px; text-align: center; color: var(--muted); font-size: 16px; }

/* ── Toast ──────────────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(14px); background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Misc ───────────────────────────────────────────────────────────────── */
.view-fade { animation: rise .2s ease; }
@keyframes rise { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.empty-ln { font-size: 14px; color: var(--muted); padding: 14px 0; }
.sep { color: var(--faint); }
</style>
</head>
<body>

<div id="root">
  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-brand">
      <div class="login-brand-content">
        <div class="login-logo"><span class="mk">p</span><span>pilot</span></div>
        <p class="login-headline">AI coding agents,<br>under your control.</p>
        <p class="login-tagline">Dispatch tasks to Claude and Codex agents. Review diffs, merge changes, ship faster.</p>
      </div>
    </div>
    <div class="login-form-panel">
      <h1 class="login-title">Welcome back</h1>
      <p class="login-sub">Sign in to your workspace</p>
      <div class="login-tabs">
        <button class="login-tab active" data-ltab="login">Sign in</button>
        <button class="login-tab" data-ltab="register">Register</button>
      </div>
      <div class="login-fields">
        <div class="field"><label>Email</label><input class="inp" type="email" placeholder="you@company.com" id="l-email"></div>
        <div class="field"><label>Password</label><input class="inp" type="password" placeholder="••••••••" id="l-pass"></div>
        <div id="l-error" style="display:none" class="login-error"></div>
        <button class="btn primary" style="width:100%;justify-content:center;padding:11px" id="l-submit">Sign in</button>
        <p style="font-size:12px;color:var(--muted);text-align:center">Self-hosted · Your keys stay on your server</p>
      </div>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <button class="wordmark" data-go="today"><span class="pilot-mark">p</span>pilot</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="side-link" id="btn-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          Search
          <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:1px 5px">⌘K</span>
        </button>
        <button class="side-link" id="btn-signout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Sign out
        </button>
      </div>
    </aside>
    <main class="app-main" id="app-main"></main>
  </div>
</div>

<!-- Command palette -->
<div class="cmdk-overlay" id="cmdk">
  <div class="cmdk" id="cmdk-panel" onclick="event.stopPropagation()">
    <input class="cmdk-inp" id="cmdk-inp" placeholder="Search agents, projects, sessions…" autocomplete="off" spellcheck="false">
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   MOCK DATA  (matching API client types)
═══════════════════════════════════════════════════════════ */
const now = Date.now()
const mAgo = m => now - m * 60_000

const DEPTS = [
  { id: 'd1', name: 'Engineering', color: '#6366f1' },
  { id: 'd2', name: 'Design',      color: '#f87171' },
  { id: 'd3', name: 'Research',    color: '#4ade80' },
]
const EMPLOYEES = [
  { id: 'e1', name: 'Mara',   initials: 'MA', provider: 'claude', role: 'lead',     departmentId: 'd1', connectionId: 'b1' },
  { id: 'e2', name: 'Devon',  initials: 'DV', provider: 'codex',  role: 'worker',   departmentId: 'd1', connectionId: 'b2' },
  { id: 'e3', name: 'Priya',  initials: 'PR', provider: 'claude', role: 'worker',   departmentId: 'd1', connectionId: 'b1' },
  { id: 'e4', name: 'Lena',   initials: 'LE', provider: 'claude', role: 'reviewer', departmentId: 'd2', connectionId: 'b1' },
  { id: 'e5', name: 'Sol',    initials: 'SO', provider: 'codex',  role: 'worker',   departmentId: 'd2', connectionId: 'b2' },
  { id: 'e6', name: 'Rai',    initials: 'RA', provider: 'claude', role: 'planner',  departmentId: 'd3', connectionId: 'b1' },
  { id: 'e7', name: 'Ana',    initials: 'AN', provider: 'claude', role: 'worker',   departmentId: 'd3', connectionId: 'b1' },
]
const PROJECTS = [
  { id: 'p1', name: 'Acme App',        repoPath: 'acme/app',       role: 'any'    },
  { id: 'p2', name: 'Billing Service', repoPath: 'acme/billing',   role: 'claude' },
  { id: 'p3', name: 'Marketing Site',  repoPath: 'acme/marketing', role: 'any'    },
  { id: 'p4', name: 'Mobile',          repoPath: 'acme/mobile',    role: 'codex'  },
]
const SESSIONS = [
  { id: 's1', agentId: 'e2', projectId: 'p1', workTaskId: 't1', status: 'running', createdAt: new Date(mAgo(261)).toISOString(), branch: 'agent/auth-session', tokens: 38200, files: 7 },
  { id: 's2', agentId: 'e6', projectId: 'p2', workTaskId: 't2', status: 'running', createdAt: new Date(mAgo(669)).toISOString(), branch: 'agent/billing-tests', tokens: 71400, files: 3 },
  { id: 's3', agentId: 'e3', projectId: 'p1', workTaskId: 't3', status: 'running', createdAt: new Date(mAgo(48)).toISOString(),  branch: 'agent/rate-limit',    tokens: 4100,  files: 2 },
  { id: 's4', agentId: 'e1', projectId: 'p1', workTaskId: 't4', status: 'done',    createdAt: new Date(mAgo(180)).toISOString(), branch: 'agent/react-query',   tokens: 52900, files: 11 },
  { id: 's5', agentId: 'e4', projectId: 'p3', workTaskId: 't5', status: 'done',    createdAt: new Date(mAgo(120)).toISOString(), branch: 'agent/empty-states',  tokens: 18800, files: 4  },
  { id: 's6', agentId: 'e5', projectId: 'p3', workTaskId: 't6', status: 'error',   createdAt: new Date(mAgo(90)).toISOString(),  branch: 'agent/icon-set',      tokens: 9200,  files: 2  },
]
const TASKS = [
  { id: 't1', projectId: 'p1', title: 'Refactor the auth session flow',          size: 'm', status: 'running', agentId: 'e2', startedAt: new Date(mAgo(261)).toISOString() },
  { id: 't2', projectId: 'p2', title: 'Investigate the flaky billing test suite', size: 'l', status: 'running', agentId: 'e6', startedAt: new Date(mAgo(669)).toISOString() },
  { id: 't3', projectId: 'p1', title: 'Add rate limiting to the public API',      size: 's', status: 'running', agentId: 'e3', startedAt: new Date(mAgo(48)).toISOString()  },
  { id: 't4', projectId: 'p1', title: 'Migrate data layer to React Query v5',     size: 'l', status: 'done' },
  { id: 't5', projectId: 'p3', title: 'Redesign the empty states',                size: 'm', status: 'done' },
  { id: 't6', projectId: 'p3', title: 'Wire up the new icon set',                 size: 's', status: 'done' },
  { id: 't7', projectId: 'p1', title: 'Paginate the activity feed endpoint',      size: 's', status: 'pending' },
  { id: 't8', projectId: 'p1', title: 'Dark-mode audit of the settings page',     size: 'm', status: 'pending' },
  { id: 't9', projectId: 'p2', title: 'Add idempotency keys to charge calls',     size: 'm', status: 'pending' },
  { id: 't10',projectId: 'p4', title: 'Fix crash on cold launch (Android 14)',    size: 's', status: 'pending' },
]
const EVENTS = [
  { id: 'ev1', type: 'session.merged',    agentId: 'e1', taskTitle: 'Cache the project file tree',          sessionId: 's4', when: mAgo(14) },
  { id: 'ev2', type: 'session.completed', agentId: 'e2', taskTitle: 'Refactor the auth session flow',       sessionId: 's1', when: mAgo(31) },
  { id: 'ev3', type: 'session.started',   agentId: 'e3', taskTitle: 'Add rate limiting to the public API',  sessionId: 's3', when: mAgo(48) },
  { id: 'ev4', type: 'session.failed',    agentId: 'e5', taskTitle: 'Wire up the new icon set',             sessionId: 's6', when: mAgo(90) },
  { id: 'ev5', type: 'session.completed', agentId: 'e4', taskTitle: 'Redesign the empty states',            sessionId: 's5', when: mAgo(120) },
  { id: 'ev6', type: 'session.started',   agentId: 'e6', taskTitle: 'Investigate the flaky billing tests',  sessionId: 's2', when: mAgo(669) },
]
const STORY = [
  { html: 'Started by reading through how sessions are created today — mapped every place a token gets minted.', tool: 'Read · src/auth/session.ts' },
  { act: true, html: 'Found <code style="font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-wash);padding:1px 5px;border-radius:4px">3</code> call sites doing it by hand. Pulled them into a single <code style="font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-wash);padding:1px 5px;border-radius:4px">issueToken()</code> helper.' },
  { html: 'Threaded the new helper through login, refresh, and impersonation paths, removing duplicated expiry math.', tool: 'Edit · src/auth/session.ts' },
  { act: true, html: 'Ran the test suite — <code style="font-family:var(--mono);font-size:12px;color:var(--green);background:color-mix(in srgb, var(--green) 10%, transparent);padding:1px 5px;border-radius:4px">41 passing</code>. Added a focused test for the refresh edge case that was previously implicit.' },
  { html: 'Wrote a short changelog note so the next person knows the token shape moved.', tool: 'Write · CHANGELOG.md' },
]

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
const emp     = id => EMPLOYEES.find(e => e.id === id)
const proj    = id => PROJECTS.find(p => p.id === id)
const task    = id => TASKS.find(t => t.id === id)
const dept    = id => DEPTS.find(d => d.id === id)

function elapsed(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000))
  const m = Math.floor(s / 60), ss = s % 60
  if (m >= 60) { const h = Math.floor(m / 60); return `${h}:${String(m%60).padStart(2,'0')}:${String(ss).padStart(2,'0')}` }
  return `${m}:${String(ss).padStart(2,'0')}`
}
function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000)
  if (m < 1) return 'just now'; if (m < 60) return `${m}m ago`
  const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`
  return `${Math.floor(h/24)}d ago`
}
function fmtK(n) { return n >= 1000 ? `${(n/1000).toFixed(1)}k` : String(n) }

const arrow = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`
const back  = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`
const check = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>`
const caretSVG = `<svg class="s-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`

function av(e, cls = '') {
  return `<span class="av${cls ? ' '+cls : ''}" style="background:color-mix(in srgb, ${dept(e?.departmentId)?.color ?? '#888'} 22%, var(--panel-2))">${e?.initials ?? '—'}</span>`
}
function avPip(e, pip) {
  const col = pip === 'running' ? 'var(--green)' : pip === 'shift' ? 'var(--accent)' : 'var(--faint)'
  return `<span class="avwrap">${av(e)}<span class="pip" style="background:${col}"></span></span>`
}

function reviewSessions(pid) {
  return SESSIONS.filter(s => (s.status === 'done' || s.status === 'error') && !s._reviewed && (!pid || s.projectId === pid))
}

/* ═══════════════════════════════════════════════════════════
   SECTION BLOCK
═══════════════════════════════════════════════════════════ */
const collapsedSet = new Set()
function section(id, title, count, body, {accent=false, seeall=false}={}) {
  const collapsed = collapsedSet.has(id) ? ' collapsed' : ''
  return `<div class="section${collapsed}" data-sec="${id}">
    <div class="section-head">
      <button class="section-toggle" data-col="${id}">${caretSVG}<span class="s-title">${title}</span>${count!=null?`<span class="s-count">${count}</span>`:''}</button>
      ${seeall ? `<button class="s-seeall" data-toast="Full history">All ${arrow}</button>` : ''}
    </div>
    ${body}
  </div>`
}

/* ═══════════════════════════════════════════════════════════
   VIEWS
═══════════════════════════════════════════════════════════ */

/* ── TODAY ── */
function viewToday() {
  const running = SESSIONS.filter(s => s.status === 'running')
  const review  = reviewSessions()
  const queued  = TASKS.filter(t => t.status === 'pending')
  const date    = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })

  const lede = review.length
    ? `<span class="num">${running.length}</span> agents working · <span class="num">${review.length}</span> need review · <span class="num">${queued.length}</span> queued`
    : `<span class="num">${running.length}</span> agents working · <span class="num">${queued.length}</span> queued`

  const metrics = [
    { v: `${EMPLOYEES.filter(e => SESSIONS.some(s=>s.agentId===e.id&&s.status==='running')).length}/${EMPLOYEES.length}`, l: 'Active now' },
    { v: '12',               l: 'Merged today' },
    { v: String(queued.length), l: 'Queue depth' },
    { v: '7m',               l: 'Avg session' },
  ].map(m => `<div class="metric"><div class="metric-val tnum">${m.v}</div><div class="metric-lbl">${m.l}</div></div>`).join('')

  const reviewRows = review.map(s => {
    const e = emp(s.agentId), t = task(s.workTaskId), p = proj(s.projectId)
    const isErr = s.status === 'error'
    return `<div class="row" style="cursor:default">
      ${av(e)}
      <button class="row-main" style="text-align:left;background:none;border:none;padding:0;cursor:pointer;min-width:0" data-go="session:${s.id}">
        <div class="row-title">${t?.title ?? s.id.slice(0,8)}</div>
        <div class="row-meta">${e?.name??'—'}<span class="sep">·</span>${p?.name??'—'}<span class="sep">·</span>${isErr?`<span style="color:var(--red)">Error</span>`:`<span style="color:var(--muted)">Ready</span>`}</div>
      </button>
      <div class="review-actions">
        <button class="btn sm primary" data-approve="${s.id}" style="padding:4px 10px">${check}Approve</button>
        <button class="btn sm ghost" data-changes="${s.id}">Changes</button>
      </div>
    </div>`
  }).join('')

  const runRows = running.map(s => {
    const e = emp(s.agentId), t = task(s.workTaskId), p = proj(s.projectId)
    return `<button class="row quiet" data-go="session:${s.id}">
      <span class="dot green pulse"></span>
      ${av(e,'sm')}
      <div class="row-main">
        <div class="row-title">${t?.title ?? s.id.slice(0,8)}</div>
        <div class="row-meta">${e?.name??'—'}<span class="sep">·</span>${p?.name??'—'}</div>
      </div>
      <span class="row-hint">↵</span>
      <span class="row-time tnum" data-elapsed="${s.createdAt}">${elapsed(s.createdAt)}</span>
    </button>`
  }).join('')

  const feedRows = EVENTS.slice(0,10).map(ev => {
    const VERB = { 'session.started':['started','var(--muted)'], 'session.completed':['finished','var(--green)'], 'session.failed':['failed on','var(--red)'], 'session.merged':['merged','var(--accent)'] }
    const [v, c] = VERB[ev.type] ?? ['updated','var(--muted)']
    const e = emp(ev.agentId)
    return `<button class="feedrow" ${ev.sessionId?`data-go="session:${ev.sessionId}"`:'data-toast="Event detail"'}>
      <span class="who">${e?.name??'—'}</span>
      <span class="verb" style="color:${c}">${v}</span>
      <span class="what">${ev.taskTitle}</span>
      <span class="when">${ago(ev.when)}</span>
    </button>`
  }).join('')

  return `<div class="page-wrap view-fade">
    <div class="eyebrow" style="margin-bottom:10px">${date}</div>
    <h1 class="h-page">Today</h1>
    <p class="lede">${lede}</p>
    <div class="metrics-strip">${metrics}</div>
    ${section('review', 'Needs review', review.length||null, review.length ? `<div class="rows accent">${reviewRows}</div>` : `<p class="empty-ln">All caught up.</p>`, {accent:true})}
    ${section('running', 'Running', running.length, `<div class="rows">${runRows}</div>`)}
    ${section('activity', 'Activity', null, `<div class="feed">${feedRows}</div>`, {seeall:true})}
  </div>`
}

/* ── AGENTS ── */
function viewAgents() {
  const runningSessions = new Map(SESSIONS.filter(s=>s.status==='running').map(s=>[s.agentId,s]))

  const groups = DEPTS.map(d => {
    const members = EMPLOYEES.filter(e => e.departmentId === d.id)
    const busy = members.filter(m => runningSessions.has(m.id)).length
    const pct = Math.round(busy / members.length * 100) || 0
    const rows = members.map(e => {
      const s = runningSessions.get(e.id)
      const t = s ? task(s.workTaskId) : null
      let meta, right, pip
      if (s) {
        pip = 'running'
        meta = `<span style="color:var(--green);font-weight:500">running</span><span class="sep">·</span><span style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block">${t?.title ?? 'a task'}</span>`
        right = `<span class="row-time tnum" data-elapsed="${s.createdAt}">${elapsed(s.createdAt)}</span>`
      } else {
        pip = 'idle'
        meta = `${e.role}<span class="sep">·</span>${e.provider}`
        right = `<span style="font-size:11px;color:var(--faint)">idle</span>`
      }
      return `<button class="row" ${s ? `data-go="session:${s.id}"` : 'data-toast="Agent profile"'}>
        ${avPip(e, pip)}
        <div class="row-main">
          <div class="row-title">${e.name}</div>
          <div class="row-meta">${meta}</div>
        </div>
        <span class="row-hint">↵</span>
        ${right}
      </button>`
    }).join('')
    return `<div class="dept-group">
      <div class="dept-head">
        <span style="width:6px;height:6px;border-radius:2px;background:${d.color};flex:none;display:inline-block"></span>
        <span class="dept-name">${d.name}</span>
        <span class="dept-info">${busy}/${members.length}</span>
        <div class="dept-bar"><span style="width:${pct}%"></span></div>
      </div>
      <div class="rows">${rows}</div>
    </div>`
  }).join('')

  const totalBusy = runningSessions.size
  return `<div class="page-wrap view-fade">
    <h1 class="h-page">Agents</h1>
    <p class="lede">${EMPLOYEES.length} agents · <span class="num">${totalBusy}</span> active</p>
    ${groups}
  </div>`
}

/* ── PROJECTS ── */
function viewProjects() {
  const rows = PROJECTS.map(p => {
    const run = SESSIONS.filter(s=>s.status==='running'&&s.projectId===p.id).length
    const rev = reviewSessions(p.id).length
    const q   = TASKS.filter(t=>t.status==='pending'&&t.projectId===p.id).length
    const bits = []
    if (run) bits.push(`<span style="color:var(--green);font-size:11.5px;font-weight:500;white-space:nowrap">${run} running</span>`)
    if (rev) bits.push(`<span style="color:var(--amber);font-size:11.5px;font-weight:500;white-space:nowrap">${rev} to review</span>`)
    if (q)   bits.push(`<span style="color:var(--faint);font-size:11.5px;white-space:nowrap">${q} queued</span>`)
    if (!bits.length) bits.push(`<span style="color:var(--faint);font-size:11.5px;white-space:nowrap">idle</span>`)
    return `<button class="row" data-go="board:${p.id}">
      <div class="row-main">
        <div class="row-title" style="font-weight:500">${p.name}</div>
        <div class="row-meta" style="margin-top:2px"><span style="font-family:var(--mono);font-size:10.5px;color:var(--faint)">${p.repoPath}</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex:none">${bits.join('<span style="color:var(--faint);font-size:11px;margin:0 1px">·</span>')}</div>
      <span class="row-go">${arrow}</span>
    </button>`
  }).join('')
  return `<div class="page-wrap view-fade">
    <h1 class="h-page">Projects</h1>
    <p class="lede">Four repositories under active work.</p>
    <div class="section" style="margin-top:36px"><div class="rows">${rows}</div></div>
  </div>`
}

/* ── BOARD ── */
function viewBoard(pid) {
  const p = proj(pid) || PROJECTS[0]
  const mine = TASKS.filter(t => t.projectId === p.id)
  const rev  = reviewSessions(p.id)
  const run  = mine.filter(t => t.status === 'running')
  const q    = mine.filter(t => t.status === 'pending')

  const qRows = q.map(t => `<button class="row" data-toast="Assign '${t.title}'">
    <span class="dot idle"></span>
    <div class="row-main"><div class="row-title" style="white-space:normal">${t.title}</div></div>

  </button>`).join('')

  const runRows = run.map(t => {
    const s = SESSIONS.find(x => x.workTaskId === t.id)
    const e = emp(t.agentId)
    return `<button class="row" ${s?`data-go="session:${s.id}"`:'data-toast="Session detail"'}>
      <span class="dot green pulse"></span>
      ${av(e,'sm')}
      <div class="row-main"><div class="row-title" style="white-space:normal">${t.title}</div><div class="row-meta">${e?.name??'—'}</div></div>
      <span class="chip mono">${t.size}</span>
      <span class="row-time tnum" ${s?`data-elapsed="${s.createdAt}"`:''}>${s?elapsed(s.createdAt):''}</span>
    </button>`
  }).join('')

  const revRows = rev.map(s => {
    const e = emp(s.agentId), t = task(s.workTaskId)
    const isErr = s.status === 'error'
    return `<div class="row" style="cursor:default;align-items:flex-start">
      ${av(e,'sm')}
      <button class="row-main" style="text-align:left;background:none;border:none;padding:0;cursor:pointer;min-width:0" data-go="session:${s.id}">
        <div class="row-title" style="white-space:normal;font-size:13px">${t?.title??s.id.slice(0,8)}</div>
        <div class="row-meta" style="margin-top:3px">${isErr?`<span style="color:var(--red)">Error</span>`:`<span style="color:var(--muted)">Ready</span>`}</div>
      </button>
      <div style="display:flex;flex-direction:column;gap:5px;flex:none;margin-top:2px">
        <button class="btn sm primary" data-approve="${s.id}" style="padding:4px 10px;font-size:11px">${check}Approve</button>
        <button class="btn sm ghost" data-changes="${s.id}" style="font-size:11px;color:var(--muted)">Changes</button>
      </div>
    </div>`
  }).join('')

  return `<div class="page-wrap wide view-fade">
    <button class="backlink" data-go="projects">${back} Projects</button>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px">
      <div>
        <div style="font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-0.01em">${p.name}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px">${p.repoPath}</div>
      </div>
      <button class="btn primary sm" data-toast="New task dialog">+ New task</button>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start">
      <div>

        <div class="rows">${q.length ? qRows : `<p class="empty-ln">No tasks queued.</p>`}</div>
      </div>
      <div>
        <div class="section-head" style="margin-bottom:8px"><span class="s-title">Running</span><span class="s-count">${run.length}</span></div>
        <div class="rows">${run.length ? runRows : `<p class="empty-ln">Nothing running.</p>`}</div>

/* ── SESSION ── */
function viewSession(sid) {
  const s = SESSIONS.find(x => x.id === sid) || SESSIONS[0]
  const e = emp(s.agentId), t = task(s.workTaskId), p = proj(s.projectId)
  const isRunning = s.status === 'running'
  const tab = state.sessionTab || 'output'

  const statusBadge = isRunning
    ? `<span class="stat green"><span class="dot green pulse"></span>Running</span>`
    : s.status === 'done'
    ? `<span class="stat amber"><span class="dot amber"></span>Awaiting review</span>`
    : `<span class="stat red"><span class="dot red"></span>Error</span>`

  const actions = isRunning
    ? `<button class="btn sm" data-toast="Session stopped">Stop</button><button class="btn sm danger" data-toast="Session discarded">Discard</button>`
    : `<button class="btn sm" data-tab-s="diff">Diff</button>
       <button class="btn sm" data-changes="${s.id}">Request changes</button>
       <button class="btn sm primary" data-approve="${s.id}">${check}Approve &amp; merge</button>`

  const telem = [
    { v: elapsed(s.createdAt), l: 'Elapsed', id: 'sv-elapsed' },
    { v: s.branch?.replace('agent/','').slice(0,24) || '—', l: 'Branch' },
    { v: fmtK(s.tokens||0), l: 'Tokens' },
    { v: String(s.files||0), l: 'Files' },
  ].map(x => `<div class="telem-item"><span class="telem-val tnum"${x.id?` id="${x.id}"`:''}>${x.v}</span><span class="telem-lbl">${x.l}</span></div>`).join('')

  const tabs = ['output','diff','journal'].map(x =>
    `<button class="tab${tab===x?' active':''}" data-tab-s="${x}">${x}</button>`).join('')

  let pane = ''
  if (tab === 'output') {
    const lines = [
      { kind:'tool', text:'▸ Read  src/auth/session.ts' },
      { kind:'text', text:'Mapping current token creation across the codebase…' },
      { kind:'tool', text:'▸ Grep  "new Token(" — 3 matches' },
      { kind:'tool', text:'▸ Edit  src/auth/session.ts  (+128 −44)' },
      { kind:'tool', text:'▸ Edit  src/auth/login.ts' },
      { kind:'tool', text:'▸ Bash  npm test -- auth' },
      { kind:'text', text:'  ✓ 41 passing  (2.4s)' },
      { kind:'text', text:'Consolidated token minting into issueToken(). Adding changelog.' },
      { kind:'tool', text:'▸ Write CHANGELOG.md' },
      { kind:'dim',  text:'done · exit 0' },
    ]
    pane = `<div class="sess-output-inner">${lines.map(l=>`<div class="out-line ${l.kind}">${l.text}</div>`).join('')}${isRunning?'<span class="cursor-blink"></span>':''}</div>`
  } else if (tab === 'diff') {
    const dl = [
      ['diff --git a/src/auth/session.ts b/src/auth/session.ts','meta'],
      ['@@ -18,9 +18,7 @@ export function login(user) {','hunk'],
      ['-  const exp = Date.now() + 1000 * 60 * 60','del'],
      ['-  const token = new Token(user.id, exp)','del'],
      ['-  token.sign(SECRET)','del'],
      ['+  const token = issueToken(user.id)','add'],
      ['   return token',''],
      ['@@ -41,6 +39,12 @@','hunk'],
      ['+export function issueToken(userId) {','add'],
      ['+  const exp = Date.now() + TOKEN_TTL','add'],
      ['+  return new Token(userId, exp).sign(SECRET)','add'],
      ['+}','add'],
    ]
    pane = `<div class="sess-output-inner"><div class="diff">${dl.map(([tx,k])=>`<div class="dl ${k}">${tx.replace(/</g,'&lt;')}</div>`).join('')}</div></div>`
  } else {
    const beats = STORY.map(b => `<div style="display:flex;gap:16px;margin-bottom:20px">
      <div style="width:2px;flex:none;border-radius:2px;background:${b.act?'var(--accent)':'var(--rule)'};margin-top:4px"></div>
      <p style="margin:0;font-size:15px;line-height:1.65;color:var(--ink-2)">${b.html}${b.tool?`<br><span style="font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-wash);padding:1px 7px;border-radius:4px;margin-top:6px;display:inline-block">${b.tool}</span>`:''}</p>
    </div>`).join('')
    pane = `<div class="sess-output-inner" style="max-width:540px">${beats}${isRunning?`<div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px"><span class="cursor-blink"></span>still working…</div>`:''}</div>`
  }

  return `<div class="session-shell view-fade">
    <div class="session-header">
      <button class="backlink" data-go="board:${p?.id||'p1'}">${back} ${p?.name||'Project'}</button>
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">
        <div class="avwrap">${av(e)}<span class="pip" style="background:${isRunning?'var(--green)':'var(--faint)'}"></span></div>
        <div style="flex:1;min-width:0">
          <div class="sess-title">${t?.title ?? s.branch ?? 'Session'}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap">
            <span style="font-size:12.5px;color:var(--ink-2);font-weight:500">${e?.name??'—'}</span>
            ${statusBadge}
          </div>
        </div>
        <div style="display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end">${actions}</div>
      </div>
      <div class="telem-strip">${telem}</div>
      <div class="tabs" style="margin-top:22px">${tabs}</div>
    </div>
    <div class="sess-output">${pane}</div>
  </div>`
}

function renderSidebar() {
  const reviewCount  = reviewSessions().length
  const runningCount = SESSIONS.filter(s=>s.status==='running').length
  const cur = state.route.split(':')[0]
  const projectsOpen = state.projectsOpen

  const links = NAV.map(n => {
    const badge = n.id==='today' && reviewCount>0 ? `<span class="side-count amber">${reviewCount}</span>` : n.id==='today' && runningCount>0 ? `<span class="side-count green">${runningCount}</span>` : ''

      return `<button class="project-link${state.route==='board:'+p.id?' active':''}" data-go="board:${p.id}">

/* ═══════════════════════════════════════════════════════════
   ROUTER + STATE
═══════════════════════════════════════════════════════════ */
const state = {
  route: localStorage.getItem('pilot.route') || 'today',
  sessionTab: 'output',
  projectsOpen: localStorage.getItem('pilot.projects') !== 'closed',
}

function render() {
  const [name, arg] = state.route.split(':')
  let html
  switch(name) {
    case 'today':    html = viewToday(); break
    case 'agents':   html = viewAgents(); break
    case 'projects': html = viewProjects(); break
    case 'board':    html = viewBoard(arg); break
    case 'session':  html = viewSession(arg); break
    case 'knowledge':html = viewSimple('Knowledge', 'Company, department, and per-agent documentation lives here.'); break
    case 'settings': html = viewSimple('Settings', 'API keys, connections, and workspace configuration.'); break
    default: html = viewToday()
  }
  document.getElementById('app-main').innerHTML = html
  renderSidebar()
  wire()
  localStorage.setItem('pilot.route', state.route)
}

function navigate(route) {
  if (route.startsWith('session')) state.sessionTab = 'output'
  state.route = route
  render()
  document.getElementById('app-main').scrollTop = 0
}

/* ── Ticking elapsed timers ── */
setInterval(() => {
  document.querySelectorAll('[data-elapsed]').forEach(el => {
    el.textContent = elapsed(el.dataset.elapsed)
  })
}, 1000)

/* ── Toast ── */
let toastTimer
function toast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.classList.add('show')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400)
}

/* ── Wire ── */
function wire() {
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); navigate(el.dataset.go) }))
  document.querySelectorAll('[data-toast]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toast(el.dataset.toast) }))
  document.querySelectorAll('[data-tab-s]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); state.sessionTab = el.dataset.tabS; render() }))
  document.querySelectorAll('[data-col]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation()
    const id = el.dataset.col
    collapsedSet.has(id) ? collapsedSet.delete(id) : collapsedSet.add(id)
    el.closest('.section').classList.toggle('collapsed')
  }))
  document.querySelectorAll('[data-approve]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation()
    const s = SESSIONS.find(x => x.id === el.dataset.approve)
    if (s) { s._reviewed = true; s.status = 'merged' }
    toast('Approved — merged ✓')
    if (state.route.startsWith('session')) navigate('today'); else render()
  }))
  document.querySelectorAll('[data-changes]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation()
    const s = SESSIONS.find(x => x.id === el.dataset.changes)
    if (s) s._reviewed = true
    toast('Changes requested — sent back')
    if (state.route.startsWith('session')) navigate('today'); else render()
  }))
  document.querySelectorAll('[data-toggle-projects]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation()
    state.projectsOpen = !state.projectsOpen
    localStorage.setItem('pilot.projects', state.projectsOpen ? 'open' : 'closed')
    renderSidebar()
    wireSidebar()
  }))
  document.getElementById('btn-search')?.addEventListener('click', openPalette)
  document.getElementById('btn-signout')?.addEventListener('click', () => { localStorage.removeItem('token'); showLogin() })
}

function wireSidebar() {
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); navigate(el.dataset.go) }))
  document.querySelectorAll('[data-toggle-projects]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation()
    state.projectsOpen = !state.projectsOpen
    localStorage.setItem('pilot.projects', state.projectsOpen ? 'open' : 'closed')
    renderSidebar(); wireSidebar()
  }))
  document.getElementById('btn-search')?.addEventListener('click', openPalette)
  document.getElementById('btn-signout')?.addEventListener('click', () => { localStorage.removeItem('token'); showLogin() })
}

/* ═══════════════════════════════════════════════════════════
   COMMAND PALETTE
═══════════════════════════════════════════════════════════ */
const P = { open: false, items: [], filtered: [], active: 0 }

function openPalette() {
  P.items = [
    ...NAV.map(n => ({ kind: 'Go', label: n.label, sub: '', route: n.id })),
    ...PROJECTS.map(p => ({ kind: 'Project', label: p.name, sub: p.repoPath, route: 'board:'+p.id })),
    ...EMPLOYEES.map(e => ({ kind: 'Agent', label: e.name, sub: e.provider+' · '+e.role, route: 'agents' })),
    ...SESSIONS.map(s => { const t = task(s.workTaskId); return { kind: 'Session', label: t?.title ?? s.id.slice(0,8), sub: s.status, route: 'session:'+s.id } }),
  ]
  P.filtered = P.items; P.active = 0
  const el = document.getElementById('cmdk')
  el.classList.add('show')
  P.open = true
  const inp = document.getElementById('cmdk-inp')
  inp.value = ''
  setTimeout(() => inp.focus(), 20)
  paintPalette()
}

function closePalette() {
  document.getElementById('cmdk').classList.remove('show')
  P.open = false
}

function filterPalette() {
  const q = document.getElementById('cmdk-inp').value.toLowerCase().trim()
  P.filtered = q ? P.items.filter(i => (i.label+' '+i.sub+' '+i.kind).toLowerCase().includes(q)) : P.items
  P.active = 0
  paintPalette()
}

function paintPalette() {
  const list = document.getElementById('cmdk-list')
  if (!P.filtered.length) { list.innerHTML = `<div class="cmdk-empty">Nothing found.</div>`; return }
  list.innerHTML = P.filtered.slice(0, 40).map((it, i) =>
    `<div class="cmdk-item${i===P.active?' hi':''}" data-pi="${i}">
      <span class="cmdk-kind">${it.kind}</span>
      <span class="cmdk-label">${it.label}</span>
      <span class="cmdk-sub">${it.sub}</span>
    </div>`).join('')
  list.querySelectorAll('.cmdk-item').forEach(el => {
    el.addEventListener('mouseover', () => { P.active = +el.dataset.pi; paintPalette() })
    el.addEventListener('click', () => { const it = P.filtered[+el.dataset.pi]; if (it) { closePalette(); navigate(it.route) } })
  })
}

document.getElementById('cmdk-inp').addEventListener('input', filterPalette)
document.getElementById('cmdk-inp').addEventListener('keydown', e => {
  if (e.key==='ArrowDown') { e.preventDefault(); P.active=Math.min(P.active+1, P.filtered.length-1); paintPalette() }
  else if (e.key==='ArrowUp') { e.preventDefault(); P.active=Math.max(P.active-1, 0); paintPalette() }
  else if (e.key==='Enter') { e.preventDefault(); const it=P.filtered[P.active]; if(it){closePalette();navigate(it.route)} }
  else if (e.key==='Escape') { closePalette() }
})
document.getElementById('cmdk').addEventListener('click', closePalette)
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k') { e.preventDefault(); P.open?closePalette():openPalette() }
  if (e.key==='/'&&!P.open&&!/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openPalette() }
})

function showLogin() {
  document.getElementById('root').className = 'login'
}
function showApp() {
  document.getElementById('root').className = 'app'
  render()
}

// Login tabs
document.querySelectorAll('.login-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    const mode = btn.dataset.ltab
    document.querySelector('.login-title').textContent = mode==='login' ? 'Welcome back' : 'Create an account'
    document.querySelector('.login-sub').textContent   = mode==='login' ? 'Sign in to your workspace' : 'Self-hosted · Your keys stay on your server'
    document.getElementById('l-submit').textContent    = mode==='login' ? 'Sign in' : 'Create account'
  })
})

document.getElementById('l-submit').addEventListener('click', () => {
  const email = document.getElementById('l-email').value.trim()
  const pass  = document.getElementById('l-pass').value
  const errEl = document.getElementById('l-error')
  if (!email || !pass) {
    errEl.textContent = 'Please fill in all fields.'
    errEl.style.display = 'block'
    return
  }
  errEl.style.display = 'none'
  localStorage.setItem('token', 'demo-token')
  showApp()
})
document.getElementById('l-pass').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('l-submit').click()
})

/* ── BOOT ── */
if (localStorage.getItem('token')) {
  showApp()
} else {
  showLogin()
}
</script>
</body>
</html>
