services:
  pilot:
    build: .
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: change-me-in-production
      DATA_DIR: /data
      # ANTHROPIC_API_KEY: sk-ant-...
      # OPENAI_API_KEY: sk-...
      # ALLOW_REGISTRATION: "true"
    volumes:
      - pilot-data:/data
    restart: unless-stopped

volumes:
  pilot-data:
