name: Pilot
options:
  bundleIdPrefix: com.pilotapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES

targets:
  Pilot:
    type: application
    platform: iOS
    sources:
      - Pilot
    info:
      path: Pilot/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pilotapp
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pilotapp.pilot
        DEVELOPMENT_TEAM: ""
